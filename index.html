<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & OpenGraph Meta Tags -->
  <title>Capital Invisible | La mecánica oculta del sistema financiero</title>
  <meta name="description" content="Descubre la mecánica oculta del sistema financiero y el método del 1%. Acceso exclusivo al lector de Capital Invisible.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Capital Invisible | Acceso Oficial">
  <meta property="og:description" content="Descubre la mecánica oculta del sistema financiero.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Outfit (headings) & Inter (UI/body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- CSS DESIGN SYSTEM (Dark Luxury) --- */
    :root {
      --color-bg: #060608;
      --color-text-primary: #ffffff;
      --color-text-secondary: #a0a0ab;
      --color-text-muted: #6e6e73;
      
      /* Luxury Gold Palette */
      --color-gold-primary: #bf953f;
      --color-gold-light: #fcf6ba;
      --color-gold-dark: #aa771c;
      --color-gold-glow: rgba(191, 149, 63, 0.4);
      --color-gold-border: rgba(191, 149, 63, 0.15);
      
      /* Metallic Gold Gradient */
      --gold-gradient: linear-gradient(
        135deg,
        #bf953f 0%,
        #fcf6ba 30%,
        #b38728 70%,
        #fbf5b7 85%,
        #aa771c 100%
      );
      
      /* Fonts */
      --font-headings: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      
      --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* --- Base reset --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* --- Ambient Background Glows & Swiss Grid --- */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(191, 149, 63, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      z-index: -1;
      pointer-events: none;
    }

    /* --- Page Container --- */
    .entrance-wrapper {
      width: 100%;
      max-width: 800px;
      min-height: 100%;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1;
    }

    /* --- Central Card Content --- */
    .gate-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: gateReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin: auto 0;
    }

    /* --- Logo Logo --- */
    .logo-container {
      position: relative;
      display: inline-block;
      transition: var(--transition-smooth);
    }

    .logo-img {
      width: 100px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(191, 149, 63, 0.15));
      transition: var(--transition-smooth);
    }

    .logo-container:hover .logo-img {
      transform: translateY(-4px) scale(1.05);
      filter: drop-shadow(0 0 30px rgba(191, 149, 63, 0.35));
    }

    /* --- Main Heading --- */
    .title {
      font-family: var(--font-headings);
      font-size: clamp(2.4rem, 6.5vw, 4rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 8px rgba(191, 149, 63, 0.15));
      line-height: 1.15;
    }

    /* --- Subtitle --- */
    .subtitle {
      font-family: var(--font-body);
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      font-weight: 300;
      color: var(--color-text-secondary);
      letter-spacing: 0.05em;
      margin-bottom: 3.5rem;
      max-width: 600px;
      line-height: 1.6;
    }

    /* --- Golden Shimmer CTA --- */
    .btn-entrar {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 1.15rem 4.5rem;
      font-family: var(--font-headings);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #050505;
      text-decoration: none;
      background: var(--gold-gradient);
      background-size: 200% auto;
      background-position: left center;
      border: none;
      border-radius: 8px;
      box-shadow: 
        0 8px 25px rgba(170, 119, 28, 0.25),
        0 0 40px rgba(191, 149, 63, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .btn-entrar:hover {
      background-position: right center;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 15px 35px rgba(191, 149, 63, 0.45),
        0 0 60px rgba(191, 149, 63, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-entrar:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 
        0 4px 15px rgba(170, 119, 28, 0.2),
        0 0 35px rgba(191, 149, 63, 0.1);
    }

    /* Shimmer Effect */
    .btn-entrar::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-25deg);
      transition: none;
    }

    .btn-entrar:hover::before {
      animation: buttonShimmer 1.8s infinite ease-in-out;
    }

    /* --- Footer Component --- */
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 3rem;
    }

    .footer-links a {
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      transition: var(--transition-fast);
      letter-spacing: 0.05em;
    }

    .footer-links a:hover {
      color: var(--color-gold-primary);
    }

    /* --- Animations --- */
    @keyframes gateReveal {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonShimmer {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    /* --- Media Queries --- */
    @media (max-width: 600px) {
      .logo-img {
        width: 85px;
      }
      .btn-entrar {
        padding: 1.1rem 3.5rem;
        font-size: 1rem;
        width: 100%;
        max-width: 280px;
      }
      .footer-links {
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="entrance-wrapper">
    
    <!-- Central Access Gate -->
    <div class="gate-container">
      <div class="logo-container">
        <img src="logo-transp.png" alt="Logo Capital Invisible" class="logo-img">
      </div>
      <h1 class="title">Capital Invisible</h1>
      <p class="subtitle">La mecánica oculta del sistema financiero.</p>
      
      <a href="audiolibro-acceso.html" class="btn-entrar">
        Entrar
      </a>
    </div>

    <!-- Footer Links -->
    <footer class="footer-links">
      <a href="aviso-legal.html">Aviso Legal</a>
      <a href="politica-privacidad.html">Política de Privacidad</a>
      <a href="politica-cookies.html">Política de Cookies</a>
      <a href="mailto:contacto@capitalinvisible.online">Contacto</a>
    </footer>

  </div>

</body>
</html>
