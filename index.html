<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Tablero Invisible | Capital Invisible</title>
  <style>
    /* --- CSS SYSTEM --- */
    :root {
      --bg-color: #000000;
      --bg-card: #080808;
      --gold-primary: #bf953f;
      --gold-border: rgba(191, 149, 63, 0.18);
      --text-primary: #f5f5f7;
      --text-muted: #d1d1d6;
      --font-sans: 'Inter', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; background-color: var(--bg-color); }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto; /* REPARADO: Permite scroll natural */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* REPARADO: Contenedor fluido para móvil, tablet y PC */
    .container {
      width: 95%;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Typography */
    h1, h2 { font-family: var(--font-serif); font-weight: 300; text-align: center; }
    p { color: var(--text-muted); line-height: 1.75; text-align: center; margin-bottom: 2rem; }

    /* Componentes */
    header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; }
    .hero { width: 100%; display: flex; flex-direction: column; align-items: center; }
    
    .form-container {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 3rem;
    }

    .input-field {
      width: 100%;
      padding: 1rem;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--gold-border);
      border-radius: 6px;
      color: white;
      text-align: center;
      margin-bottom: 1rem;
    }

    .btn-gold-minimal {
      width: 100%;
      padding: 1rem;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: 0.3s;
    }

    .btn-gold-minimal:hover { background: var(--gold-primary); color: black; }

    /* Conversión */
    .product-card {
      width: 100%;
      border: 1px solid var(--gold-border);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-text">CAPITAL INVISIBLE</div>
    </header>

    <main class="hero">
      <h1 class="hero-title">El Tablero Invisible</h1>
      <p>Descubre la mecánica oculta del sistema financiero.</p>

      <div class="form-container">
        <form action="https://assets.mailerlite.com/jsonp/2409609/forms/190872395390649912/subscribe" method="post">
          <input type="email" name="fields[email]" class="input-field" placeholder="Tu correo privado..." required>
          <button type="submit" class="btn-gold-minimal">Acceso Gratis</button>
        </form>
      </div>
    </main>

    <section class="product-card">
      <h2>Comprar, Pedir Prestado, Morir</h2>
      <a href="https://payhip.com/b/G7ath" class="btn-gold-minimal" style="margin-top: 1rem;">Acceder al Sistema</a>
    </section>
  </div>

</body>
</html>
