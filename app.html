<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=audiolibro-acceso.html">
  <title>Redireccionando... | Capital Invisible</title>
  <script>
    // Preservar parámetros de búsqueda y hashes en la redirección
    window.location.replace("audiolibro-acceso.html" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      background-color: #060608;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(191, 149, 63, 0.1);
      border-top-color: #bf953f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .text {
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a0a0ab;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <div class="text">Redireccionando al lector...</div>
  </div>
</body>
</html>
