<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Limpiando caché...</title>
<style>
  body { background:#06060c; color:#f1eeff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
</style>
</head>
<body>
  <div>
    <p id="status">Limpiando datos antiguos del sitio...</p>
  </div>
  <script>
    async function limpiarTodo() {
      const statusEl = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }
        try { localStorage.clear(); } catch (e) {}
        statusEl.textContent = 'Listo. Redirigiendo...';
      } catch (e) {
        statusEl.textContent = 'Limpieza parcial (' + e.message + '). Redirigiendo igualmente...';
      }
      setTimeout(function() {
        window.location.href = '/audiolibro-acceso.html?v=' + Date.now();
      }, 800);
    }
    limpiarTodo();
  </script>
</body>
</html>
